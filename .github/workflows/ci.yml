name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

jobs:
  api:
    name: check (api)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: api
    env:
      CI: true
      JWT_SECRET: ci-secret
      JWT_EXPIRES_IN: 15m
      JWT_REFRESH_SECRET: ci-refresh-secret
      JWT_REFRESH_EXPIRES_IN: 7d
    services:
      # Ephemeral instance for this run only — no history/dashboard persists between
      # CI runs, unlike the docker-compose `sonarqube` service used for local analysis.
      sonarqube:
        image: sonarqube:community
        ports:
          - 9000:9000
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: api/package-lock.json

      - run: npm ci

      - run: npm run lint

      - run: npm run test:cov

      - run: npm run test:e2e

      - name: Wait for SonarQube
        run: |
          for i in $(seq 1 30); do
            if curl -sf http://localhost:9000/api/system/status | grep -q '"status":"UP"'; then
              exit 0
            fi
            sleep 5
          done
          echo "SonarQube did not become ready in time" >&2
          exit 1

      - name: Generate SonarQube token
        id: sonar_token
        run: |
          TOKEN=$(curl -sf -u admin:admin -X POST "http://localhost:9000/api/user_tokens/generate" -d "name=ci-${{ github.run_id }}" | jq -r .token)
          echo "::add-mask::$TOKEN"
          echo "token=$TOKEN" >> "$GITHUB_OUTPUT"

      - name: SonarQube Scan
        uses: sonarsource/sonarqube-scan-action@v4
        with:
          projectBaseDir: api
        env:
          SONAR_HOST_URL: http://localhost:9000
          SONAR_TOKEN: ${{ steps.sonar_token.outputs.token }}

      - run: npm run build

  web:
    name: check (web)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    env:
      CI: true
    services:
      # Ephemeral instance for this run only — no history/dashboard persists between
      # CI runs, unlike the docker-compose `sonarqube` service used for local analysis.
      sonarqube:
        image: sonarqube:community
        ports:
          - 9000:9000
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: web/package-lock.json

      - run: npm ci

      - run: npm run lint

      - run: npm run test:cov

      - name: Wait for SonarQube
        run: |
          for i in $(seq 1 30); do
            if curl -sf http://localhost:9000/api/system/status | grep -q '"status":"UP"'; then
              exit 0
            fi
            sleep 5
          done
          echo "SonarQube did not become ready in time" >&2
          exit 1

      - name: Generate SonarQube token
        id: sonar_token
        run: |
          TOKEN=$(curl -sf -u admin:admin -X POST "http://localhost:9000/api/user_tokens/generate" -d "name=ci-${{ github.run_id }}" | jq -r .token)
          echo "::add-mask::$TOKEN"
          echo "token=$TOKEN" >> "$GITHUB_OUTPUT"

      - name: SonarQube Scan
        uses: sonarsource/sonarqube-scan-action@v4
        with:
          projectBaseDir: web
        env:
          SONAR_HOST_URL: http://localhost:9000
          SONAR_TOKEN: ${{ steps.sonar_token.outputs.token }}

      - run: npm run build

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium

      - run: npm run test:e2e
