name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

jobs:
  api:
    name: check (api)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: api
    env:
      CI: true
      DB_HOST: 127.0.0.1
      DB_PORT: 3306
      DB_NAME: school_management
      DB_USER: sms_user
      DB_PASSWORD: sms_password
      JWT_SECRET: ci-secret
      JWT_EXPIRES_IN: 15m
      JWT_REFRESH_SECRET: ci-refresh-secret
      JWT_REFRESH_EXPIRES_IN: 7d
    services:
      mysql:
        image: mysql:8.4
        env:
          MYSQL_DATABASE: school_management
          MYSQL_USER: sms_user
          MYSQL_PASSWORD: sms_password
          MYSQL_ROOT_PASSWORD: rootpassword
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h localhost -u root -prootpassword"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: api/package-lock.json

      - run: npm ci

      - run: npm run lint

      - run: npm run test:cov

      - run: npm run test:e2e

      - run: npm run build

  web:
    name: check (web)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    env:
      CI: true
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: web/package-lock.json

      - run: npm ci

      - run: npm run lint

      - run: npm run test:cov

      - run: npm run build

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium

      - run: npm run test:e2e
