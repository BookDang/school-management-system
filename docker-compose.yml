services:
  db:
    image: mysql:8.4
    container_name: sms_mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-rootpassword}
      MYSQL_DATABASE: ${MYSQL_DATABASE:-school_management}
      MYSQL_USER: ${MYSQL_USER:-sms_user}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:-sms_password}
    ports:
      - "${MYSQL_PORT:-3306}:3306"
    volumes:
      - db_data:/var/lib/mysql
    healthcheck:
      test: ['CMD-SHELL', 'mysqladmin ping -h localhost']
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    networks:
      - sms_network

  api:
    build:
      context: .
      dockerfile: .docker/api/Dockerfile
    container_name: sms_api
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      NODE_ENV: ${NODE_ENV:-development}
      PORT: 4000
      DB_HOST: db
      DB_PORT: 3306
      DB_NAME: ${MYSQL_DATABASE:-school_management}
      DB_USER: ${MYSQL_USER:-sms_user}
      DB_PASSWORD: ${MYSQL_PASSWORD:-sms_password}
      JWT_SECRET: ${JWT_SECRET:-dev-secret-change-me}
      JWT_EXPIRES_IN: ${JWT_EXPIRES_IN:-15m}
      JWT_REFRESH_SECRET: ${JWT_REFRESH_SECRET:-dev-refresh-secret-change-me}
      JWT_REFRESH_EXPIRES_IN: ${JWT_REFRESH_EXPIRES_IN:-7d}
      CORS_ORIGIN: ${CORS_ORIGIN:-http://sms.site}
    expose:
      - "4000"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:4000/health"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 15s
    volumes:
      - ./api:/app
      - /app/node_modules
    networks:
      - sms_network

  web:
    build:
      context: .
      dockerfile: .docker/web/Dockerfile
    container_name: sms_web
    restart: unless-stopped
    depends_on:
      api:
        condition: service_healthy
    environment:
      NODE_ENV: ${NODE_ENV:-development}
      PORT: 3000
      NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-/api}
      # Host file-change events (inotify) don't reliably reach a Linux container through Docker
      # Desktop's bind-mount bridge on Windows/macOS - fall back to polling so Fast Refresh
      # actually picks up edits instead of serving a stale build until the container restarts.
      # Only takes effect because .docker/web/Dockerfile runs `next dev --webpack`
      # (`dev:docker` script) - the default Turbopack dev server doesn't honor this var.
      WATCHPACK_POLLING: 'true'
    expose:
      - "3000"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3000/"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 15s
    volumes:
      - ./web:/app
      - /app/node_modules
      - /app/.next
    networks:
      - sms_network

  nginx:
    image: nginx:1.31.5
    container_name: sms_nginx
    restart: unless-stopped
    depends_on:
      web:
        condition: service_healthy
      api:
        condition: service_healthy
    ports:
      - "${HTTP_PORT:-80}:80"
    volumes:
      - ./.docker/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    networks:
      - sms_network

  sonarqube:
    image: sonarqube:community
    container_name: sms_sonarqube
    restart: unless-stopped
    ports:
      - "${SONARQUBE_PORT:-9000}:9000"
    volumes:
      - sonarqube_data:/opt/sonarqube/data
      - sonarqube_extensions:/opt/sonarqube/extensions
      - sonarqube_logs:/opt/sonarqube/logs
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:9000/api/system/status | grep -q '\"status\":\"UP\"'"]
      interval: 30s
      timeout: 10s
      retries: 10
      start_period: 60s
    networks:
      - sms_network

  # One-off analysis jobs, not part of the always-on stack — run explicitly with
  # `docker compose run --rm sonar-scanner` / `sonar-scanner-web` (or `npm run sonar` inside api/ or web/).
  sonar-scanner:
    image: sonarsource/sonar-scanner-cli:latest
    container_name: sms_sonar_scanner
    profiles: ["tools"]
    depends_on:
      sonarqube:
        condition: service_healthy
    environment:
      SONAR_HOST_URL: http://sonarqube:9000
      SONAR_TOKEN: ${SONAR_TOKEN:-}
    working_dir: /usr/src
    volumes:
      - ./api:/usr/src
    networks:
      - sms_network

  sonar-scanner-web:
    image: sonarsource/sonar-scanner-cli:latest
    container_name: sms_sonar_scanner_web
    profiles: ["tools"]
    depends_on:
      sonarqube:
        condition: service_healthy
    environment:
      SONAR_HOST_URL: http://sonarqube:9000
      SONAR_TOKEN: ${SONAR_TOKEN:-}
    working_dir: /usr/src
    volumes:
      - ./web:/usr/src
    networks:
      - sms_network

volumes:
  db_data:
  sonarqube_data:
  sonarqube_extensions:
  sonarqube_logs:

networks:
  sms_network:
    driver: bridge
